name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 跑断言
        run: dotnet test test/Hosihikari.Tests/Hosihikari.McMaster.NETCore.Plugins.Tests.csproj -c Release --nologo
